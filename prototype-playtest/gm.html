<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GM 测试局 · 竞猜竞技场</title><link rel="stylesheet" href="./style.css"></head>
<body><main class="gm"><header><h1>GM 测试局</h1><nav class="gm-nav"><a href="./replay.html">导入战局重播</a><a href="./">返回竞猜</a></nav></header>
<div class="gm-layout"><section class="panel gm-board-panel"><div class="gm-board-header"><p id="state"></p><button id="new" type="button" class="secondary">清空棋盘并新建</button></div><div id="map" class="board hex-board" aria-label="测试棋盘"></div><p id="inspect" aria-live="polite"></p><ul id="hits"></ul></section>
<aside id="gm-battle-log" class="panel battle-log-panel" aria-labelledby="battle-log-title">
  <div class="battle-log-header"><h2 id="battle-log-title">战斗日志</h2><button type="button" class="secondary battle-log-latest" disabled>回到最新</button></div>
  <div class="battle-log-scroll" tabindex="0" role="region" aria-label="累计战斗日志">
    <p class="battle-log-empty">开战后显示日志。</p>
    <ol class="battle-log-beats"></ol>
  </div>
</aside>
<section class="panel gm-control-panel"><fieldset id="edit"><legend>开战前布阵</legend>
<label>阵营<select id="side"><option value="red">红队</option><option value="blue">蓝队</option></select></label><label>兵种<select id="unit"></select></label>
<p>点选棋盘位置。亮框是本方可建营格。放兵时可指定等级和剩余生命；开战后点格子查看本拍攻击和治疗。</p><button id="build">在所选格建营</button><button id="place">放置测试兵</button>
<label>所选格对象<select id="entity"></select></label><label>等级<select id="level"><option>1</option><option>2</option><option>3</option></select></label>
<button id="up">兵营升一级</button><button id="set-level">设置兵营等级</button>
<label>剩余生命<input id="hp" type="number" min="1" step="1" placeholder="放兵时留空为满血"></label><button id="set-hp">设置所选对象生命</button><button id="remove">移除所选兵或营</button></fieldset>
<div class="battle-data-actions"><button id="start">封盘开战</button><button id="play">播放</button><button id="step">前进 0.5 秒</button><button id="restart">原样重开</button><button id="back">返回布阵</button><button id="mirror">红蓝镜像布阵</button><button id="export">导出测试局</button></div>
<p id="notice" role="status"></p>
<section class="gm-wallet" aria-labelledby="wallet-title">
  <h2 id="wallet-title">试玩测试积分</h2>
  <dl class="gm-balances"><div><dt>当前余额</dt><dd id="wallet-current">—</dd></div><div><dt>预计余额</dt><dd id="wallet-projected" aria-live="polite">—</dd></div></dl>
  <form id="test-wallet" novalidate>
    <fieldset id="wallet-fields" class="wallet-fields" aria-label="积分调整" disabled>
      <label>操作<select id="wallet-direction"><option value="add">增加</option><option value="subtract">扣减</option></select></label>
      <label>点数<input id="wallet-amount" type="number" min="1" step="1" inputmode="numeric"></label>
    </fieldset>
    <button id="wallet-submit" type="submit" disabled>确认调整</button>
    <p id="wallet-notice" class="notice" role="status"></p>
  </form>
</section></section></div></main><script type="module" src="./gm.mjs"></script></body></html>
